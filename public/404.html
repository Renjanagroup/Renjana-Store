<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Renjana Store</title>
    <!--
      Trik standar untuk Single Page App di GitHub Pages.
      GitHub Pages tidak punya server-side rewrite, jadi kalau user buka
      langsung /Renjana-Store/koleksi atau refresh halaman itu, GitHub akan
      menampilkan file ini (404.html). Script ini mengubah path yang diminta
      jadi query string, lalu redirect ke index.html, yang nanti akan
      mengembalikannya jadi path asli lewat script kecil di index.html.
      Sumber teknik: https://github.com/rafgraph/spa-github-pages
    -->
    <script type="text/javascript">
      // Sumber teknik: https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1; // jumlah folder di base path, /Renjana-Store/ = 1
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
